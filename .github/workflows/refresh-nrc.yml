name: Nightly NRC refresh and Pages deployment
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'config/**', 'tests/**', '*.json', '*.ts', 'index.html', '.github/workflows/refresh-nrc.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-nrc
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Fetch and archive NRC reports
        run: npm run data:refresh
      - name: Check report extraction
        run: python3 -m unittest discover -s tests -v
      - name: Check frontend
        run: npm run check
      - name: Build React SPA
        run: npm run build
      - name: Save successful snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ archive/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive NRC reports and findings'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
